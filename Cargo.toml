[package]
name = "envfreeze"
version = "0.2.0"
edition = "2024"
description = "按项目环境成套冻结/恢复 Windows 开发程序：隐藏窗口、挂起进程、换出内存，托盘 + 全局快捷键"
license = "Apache-2.0"
repository = "https://github.com/florune/envfreeze"
readme = "README.md"
keywords = ["windows", "memory", "suspend", "workspace", "tray"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.37.0"
global-hotkey = "0.9.0"
notify-rust = "4.18.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
